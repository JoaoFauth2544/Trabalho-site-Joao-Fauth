<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ETS2</title>
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>
<body>

    <div class="container">
        
        <div class="capa-container">
            <img src="../img/ets2_banner.jpg" alt="Euro Truck Simulator 2 Banner">
        </div>

        <nav class="menu">
            <ul>
                <li><a href="home.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

        <h1>Fale Conosco</h1>
        <p>Escolha o canal de sua preferência ou preencha o formulário abaixo.</p>
        
        <div class="contato-cards">
            <div class="card">
                <h3>E-mail</h3>
                <a href="mailto:2024302495@aluno.sertao.ifrs.edu.br">2024302495@aluno.sertao.ifrs.edu.br</a>
            </div>
            <div class="card">
                <h3>WhatsApp</h3>
                <a href="https://wa.me/5554999799197" target="_blank">(54) 999799197</a>
            </div>
        </div>

        <div class="formulario-secao">
            <h2>Mande uma mensagem</h2>
            <form class="form-contato">
                <div class="grupo-input">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Ex: João Vitor I. Fauth" required>
                </div>
                <div class="grupo-input">
                    <label>E-mail para resposta</label>
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="grupo-input">
                    <label>Sua Mensagem</label>
                    <textarea placeholder="Como podemos ajudar?" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar Agora</button>
            </form>
        </div>

    </div>

</body>
</html>
